<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeebCentral Web Hook</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    background: #0b0c0f;
    color: #f4f5f7;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .card {
    width: min(560px, 100%);
    border: 1px solid #252832;
    background: linear-gradient(180deg, #14161b, #0f1014);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 0; color: #aeb3be; line-height: 1.5; font-size: 14px; }
  .target {
    margin: 16px 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: #101218;
    border: 1px solid #242833;
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    background: #8a8f9d;
  }
  .dot.ok { background: #62d68a; }
  .dot.bad { background: #ff7272; }
  button {
    width: 100%;
    margin-top: 12px;
    border: 0;
    border-radius: 14px;
    padding: 13px 16px;
    background: #f2f3f5;
    color: #0d0e11;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:active { transform: scale(.99); }
  .hint { margin-top: 12px; font-size: 12px; color: #858b97; }
  code { color: #d5d8df; }
</style>
</head>
<body>
  <main class="card">
    <h1>WeebCentral</h1>
    <p>This page is only a launcher. It asks the Sekai host to open the real WeebCentral website.</p>

    <div class="target">
      <span class="dot" id="dot"></span>
      <span id="statusText">Checking Sekai bridge…</span>
      <div style="margin-top:8px;color:#d5d8df;">https://weebcentral.com/</div>
    </div>

    <button id="openBtn" type="button">OPEN WEeBCENTRAL</button>

    <div class="hint">
      Uses <code>sekaiBridge.openUrl()</code>. No iframe, fetch, XHR, proxy, or fake website is used here.
    </div>
  </main>

<script>
(() => {
  const TARGET_URL = 'https://weebcentral.com/';
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const openBtn = document.getElementById('openBtn');

  function getBridge() {
    const bridge = window.sekaiBridge;
    return bridge && typeof bridge.openUrl === 'function' ? bridge : null;
  }

  function updateBridgeStatus() {
    const bridge = getBridge();
    if (bridge) {
      dot.className = 'dot ok';
      statusText.textContent = 'Sekai bridge detected.';
    } else {
      dot.className = 'dot bad';
      statusText.textContent = 'Sekai bridge not detected. Run this inside Sekai.';
    }
    return bridge;
  }

  function openTarget() {
    const bridge = updateBridgeStatus();
    if (!bridge) return;

    statusText.textContent = 'Opening WeebCentral…';
    try {
      bridge.openUrl(TARGET_URL);
    } catch (err) {
      dot.className = 'dot bad';
      statusText.textContent = 'openUrl() failed: ' + (err?.message || String(err));
    }
  }

  openBtn.addEventListener('click', openTarget);
  updateBridgeStatus();
})();
</script>
</body>
</html>
